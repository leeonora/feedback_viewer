<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Overview</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #657282;
      --line: #d9dee7;
      --blue: #1f6feb;
      --green: #1f8a4c;
      --red: #c93d3d;
      --amber: #a66a00;
      --chip: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 24px 28px 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
    }

    main {
      padding: 24px 28px 40px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .status {
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      color: var(--muted);
    }

    .status strong {
      color: var(--ink);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      min-height: 84px;
    }

    .card .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 28px;
      font-weight: 700;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.2fr repeat(5, minmax(140px, 0.55fr));
      gap: 12px;
      margin-bottom: 18px;
      align-items: end;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
    }

    input[type="search"],
    select,
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      font: inherit;
      min-height: 42px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 650;
    }

    .panel-meta {
      color: var(--muted);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      background: #fbfcfe;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td {
      background: #fafcff;
    }

    .table-wrap {
      max-height: 720px;
      overflow: auto;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--ink);
      padding: 3px 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    .yes { color: var(--green); }
    .no { color: var(--red); }
    .random { color: var(--amber); }
    .not-random { color: var(--green); }

    .comment {
      max-width: 300px;
      color: var(--ink);
    }

    .muted {
      color: var(--muted);
    }

    details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      color: var(--blue);
      font-size: 13px;
      user-select: none;
    }

    .matches {
      margin-top: 8px;
      display: grid;
      gap: 8px;
    }

    .match-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #fbfcfe;
    }

    .match-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 650;
      margin-bottom: 4px;
    }

    .part-name {
      color: var(--ink);
    }

    .tiny {
      font-size: 12px;
      color: var(--muted);
    }

    .side-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .side-section:last-child {
      border-bottom: 0;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 112px 1fr 42px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      font-size: 13px;
    }

    .bar-track {
      height: 10px;
      background: #edf1f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
    }

    .matrix {
      display: grid;
      grid-template-columns: 96px 1fr 1fr;
      gap: 1px;
      margin-top: 10px;
      border: 1px solid var(--line);
      background: var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .matrix-cell {
      background: #fff;
      padding: 9px;
      min-height: 58px;
    }

    .matrix-head {
      background: #fbfcfe;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-height: auto;
    }

    .matrix-value {
      font-size: 22px;
      font-weight: 700;
    }

    .matrix-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .user-list {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      max-height: 260px;
      overflow: auto;
      padding-right: 4px;
    }

    .user-button {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      width: 100%;
      border: 1px solid var(--line);
      background: #fbfcfe;
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .user-button:hover,
    .user-button.active {
      border-color: var(--blue);
      background: #f0f6ff;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Feedback Overview</h1>
    <div class="subtitle">Interactive summary of <code>feedback.jsonl</code></div>
  </header>

  <main>
    <div id="status" class="status">
      <strong>Load feedback data:</strong>
      choose <code>feedback.jsonl</code> to populate the overview.
      <input id="fileInput" type="file" accept=".jsonl,.txt,application/json">
    </div>

    <section class="cards" id="cards"></section>

    <section class="filters">
      <div class="control">
        <label for="search">Search comments, part names, part numbers, users</label>
        <input id="search" type="search" placeholder="Search feedback...">
      </div>
      <div class="control">
        <label for="randomFilter">Random result</label>
        <select id="randomFilter">
          <option value="all">All</option>
          <option value="true">Random only</option>
          <option value="false">Not random only</option>
          <option value="missing">Missing flag</option>
        </select>
      </div>
      <div class="control">
        <label for="satisfiedFilter">Satisfied</label>
        <select id="satisfiedFilter">
          <option value="all">All</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
          <option value="missing">Missing</option>
        </select>
      </div>
      <div class="control">
        <label for="partFilter">Part</label>
        <select id="partFilter">
          <option value="all">All parts</option>
        </select>
      </div>
      <div class="control">
        <label for="userFilter">User</label>
        <select id="userFilter">
          <option value="all">All users</option>
        </select>
      </div>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Feedback Records</div>
          <div id="tableMeta" class="panel-meta"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Time</th>
                <th>User</th>
                <th>Satisfied</th>
                <th>Random</th>
                <th>Confirmed</th>
                <th>Comment / Details</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-header">
          <div class="panel-title">Summary</div>
          <div class="panel-meta" id="summaryMeta"></div>
        </div>
        <div class="side-section" id="satisfactionBars"></div>
        <div class="side-section" id="randomBars"></div>
        <div class="side-section" id="randomSatisfactionMatrix"></div>
        <div class="side-section" id="partBars"></div>
        <div class="side-section" id="userList"></div>
      </aside>
    </section>
  </main>

  <script>
    const DATA_FILE = "feedback.jsonl";
    const MIN_TIMESTAMP = "2026-05-18T12:49:20.649647";
    const MIN_TIME = new Date(MIN_TIMESTAMP).getTime();
    const PART_ORDER = ["Face", "Hair", "Upper Body", "Lower Body"];
    let allRecords = [];

    const el = (id) => document.getElementById(id);

    function parseJsonl(text) {
      return text
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line, index) => {
          try {
            return { lineNumber: index + 1, ...JSON.parse(line) };
          } catch (error) {
            return { lineNumber: index + 1, parse_error: error.message, raw: line };
          }
        });
    }

    function randomStatus(record) {
      if (!Object.prototype.hasOwnProperty.call(record, "result_is_random")) return "missing";
      return record.result_is_random === true ? "true" : "false";
    }

    function satisfiedStatus(record) {
      if (record.satisfied === "yes") return "yes";
      if (record.satisfied === "no") return "no";
      return "missing";
    }

    function confirmedSummary(record) {
      if (record.all_matches_confirmed === true) return "All";
      if (Array.isArray(record.confirmed_match_regions) && record.confirmed_match_regions.length) {
        return record.confirmed_match_regions.join(", ");
      }
      if (record.best_matches_confirmed === true) return "Best";
      if (record.confirmed_match_ranks && Object.keys(record.confirmed_match_ranks).length) {
        return Object.entries(record.confirmed_match_ranks)
          .map(([part, rank]) => `${part}: ${rank}`)
          .join(", ");
      }
      return "None";
    }

    function recordParts(record) {
      const parts = new Set();
      for (const source of ["selected_matches", "confirmed_matches", "top_five_matches"]) {
        const matches = record[source] || {};
        Object.keys(matches).forEach((part) => parts.add(part));
      }
      return [...parts];
    }

    function userId(record) {
      return record.user_id || "Missing user";
    }

    function isAfterMinTimestamp(record) {
      if (!record.timestamp) return false;
      const timestamp = new Date(record.timestamp).getTime();
      return !Number.isNaN(timestamp) && timestamp >= MIN_TIME;
    }

    function searchableText(record) {
      return JSON.stringify(record).toLowerCase();
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function pct(value, total) {
      if (!total) return "0%";
      return `${Math.round((value / total) * 100)}%`;
    }

    function countBy(records, fn) {
      const counts = {};
      records.forEach((record) => {
        const key = fn(record);
        counts[key] = (counts[key] || 0) + 1;
      });
      return counts;
    }

    function selectedOrConfirmedMatches(record) {
      if (record.confirmed_matches && Object.keys(record.confirmed_matches).length) {
        return record.confirmed_matches;
      }
      if (record.selected_matches && Object.keys(record.selected_matches).length) {
        return record.selected_matches;
      }
      return {};
    }

    function renderMatchCard(part, match) {
      if (!match) return "";
      const score = typeof match.score === "number" ? match.score.toFixed(3) : "n/a";
      const rank = match.rank ?? "n/a";
      return `
        <div class="match-card">
          <div class="match-title">
            <span>${part}</span>
            <span class="tiny">rank ${rank} · score ${score}</span>
          </div>
          <div class="part-name">${escapeHtml(match.part_name || "No part name")}</div>
          <div class="tiny">${escapeHtml(match.part_num || "")} · ${escapeHtml(match.color_name || "")} · element ${escapeHtml(String(match.element_id ?? ""))}</div>
        </div>
      `;
    }

    function renderDetails(record) {
      const matches = selectedOrConfirmedMatches(record);
      const topFive = record.top_five_matches || {};
      const matchCards = Object.entries(matches)
        .map(([part, match]) => renderMatchCard(part, match))
        .join("");

      const topFiveSummary = Object.entries(topFive)
        .map(([part, items]) => {
          if (!Array.isArray(items) || !items.length) return "";
          const selected = items.find((item) => item.is_selected) || items[0];
          return renderMatchCard(`${part} top/selected`, selected);
        })
        .join("");

      if (!matchCards && !topFiveSummary) return "";

      return `
        <details>
          <summary>Show matches</summary>
          <div class="matches">
            ${matchCards || topFiveSummary}
          </div>
        </details>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function applyFilters() {
      const randomFilter = el("randomFilter").value;
      const satisfiedFilter = el("satisfiedFilter").value;
      const partFilter = el("partFilter").value;
      const userFilter = el("userFilter").value;
      const query = el("search").value.trim().toLowerCase();

      return allRecords.filter((record) => {
        if (record.parse_error) return false;
        if (!isAfterMinTimestamp(record)) return false;
        if (randomFilter !== "all" && randomStatus(record) !== randomFilter) return false;
        if (satisfiedFilter !== "all" && satisfiedStatus(record) !== satisfiedFilter) return false;
        if (partFilter !== "all" && !recordParts(record).includes(partFilter)) return false;
        if (userFilter !== "all" && userId(record) !== userFilter) return false;
        if (query && !searchableText(record).includes(query)) return false;
        return true;
      });
    }

    function renderCards(records) {
      const total = records.length;
      const randomCounts = countBy(records, randomStatus);
      const satisfiedCounts = countBy(records, satisfiedStatus);
      const confirmedAll = records.filter((record) => record.all_matches_confirmed === true).length;
      const withComments = records.filter((record) => record.comment && String(record.comment).trim()).length;
      const uniqueUsers = new Set(records.map(userId)).size;

      const cards = [
        ["Records", total],
        ["Unique users", uniqueUsers],
        ["Satisfied yes", satisfiedCounts.yes || 0],
        ["Satisfied no", satisfiedCounts.no || 0],
        ["Random", randomCounts.true || 0],
        ["Not random", randomCounts.false || 0],
      ];

      el("cards").innerHTML = cards.map(([label, value]) => `
        <div class="card">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </div>
      `).join("");
    }

    function renderBars(containerId, title, counts, labels, total) {
      const rows = labels.map(([key, label]) => {
        const value = counts[key] || 0;
        return `
          <div class="bar-row">
            <div>${label}</div>
            <div class="bar-track"><div class="bar-fill" style="width: ${pct(value, total)}"></div></div>
            <div class="muted">${value}</div>
          </div>
        `;
      }).join("");
      el(containerId).innerHTML = `<strong>${title}</strong>${rows}`;
    }

    function renderSidebar(records) {
      const total = records.length;
      el("summaryMeta").textContent = `${total} shown`;
      renderBars("satisfactionBars", "Satisfaction", countBy(records, satisfiedStatus), [
        ["yes", "Yes"],
        ["no", "No"],
        ["missing", "Missing"],
      ], total);
      renderBars("randomBars", "Random Result", countBy(records, randomStatus), [
        ["true", "Random"],
        ["false", "Not random"],
        ["missing", "Missing"],
      ], total);
      renderRandomSatisfactionMatrix(records);

      const partCounts = {};
      records.forEach((record) => recordParts(record).forEach((part) => {
        partCounts[part] = (partCounts[part] || 0) + 1;
      }));
      renderBars("partBars", "Part Coverage", partCounts, PART_ORDER.map((part) => [part, part]), total);
      renderUserList(records);
    }

    function renderRandomSatisfactionMatrix(records) {
      const cells = {
        random_yes: 0,
        random_no: 0,
        not_random_yes: 0,
        not_random_no: 0,
      };

      records.forEach((record) => {
        const random = randomStatus(record);
        const satisfied = satisfiedStatus(record);
        if (random === "true" && satisfied === "yes") cells.random_yes += 1;
        if (random === "true" && satisfied === "no") cells.random_no += 1;
        if (random === "false" && satisfied === "yes") cells.not_random_yes += 1;
        if (random === "false" && satisfied === "no") cells.not_random_no += 1;
      });

      const randomTotal = cells.random_yes + cells.random_no;
      const notRandomTotal = cells.not_random_yes + cells.not_random_no;
      const randomNoRate = randomTotal ? cells.random_no / randomTotal : 0;
      const notRandomNoRate = notRandomTotal ? cells.not_random_no / notRandomTotal : 0;
      const delta = randomNoRate - notRandomNoRate;
      const deltaText = `${Math.round(delta * 100)} percentage points`;

      el("randomSatisfactionMatrix").innerHTML = `
        <strong>Random vs. Satisfaction</strong>
        <div class="matrix">
          <div class="matrix-cell matrix-head"></div>
          <div class="matrix-cell matrix-head">Satisfied yes</div>
          <div class="matrix-cell matrix-head">Satisfied no</div>
          <div class="matrix-cell matrix-head">Random</div>
          <div class="matrix-cell">
            <div class="matrix-value yes">${cells.random_yes}</div>
            <div class="tiny">${pct(cells.random_yes, randomTotal)}</div>
          </div>
          <div class="matrix-cell">
            <div class="matrix-value no">${cells.random_no}</div>
            <div class="tiny">${pct(cells.random_no, randomTotal)}</div>
          </div>
          <div class="matrix-cell matrix-head">Not random</div>
          <div class="matrix-cell">
            <div class="matrix-value yes">${cells.not_random_yes}</div>
            <div class="tiny">${pct(cells.not_random_yes, notRandomTotal)}</div>
          </div>
          <div class="matrix-cell">
            <div class="matrix-value no">${cells.not_random_no}</div>
            <div class="tiny">${pct(cells.not_random_no, notRandomTotal)}</div>
          </div>
        </div>
        <div class="matrix-note">
          Unsatisfied rate is ${pct(cells.random_no, randomTotal)} for random results vs. ${pct(cells.not_random_no, notRandomTotal)} for non-random results (${deltaText} higher for random).
        </div>
      `;
    }

    function renderUserList(records) {
      const counts = countBy(records, userId);
      const users = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const selectedUser = el("userFilter").value;
      el("userList").innerHTML = `
        <strong>Users</strong>
        <div class="user-list">
          <button class="user-button ${selectedUser === "all" ? "active" : ""}" data-user="all">
            <span>All users</span>
            <span class="muted">${records.length}</span>
          </button>
          ${users.map(([user, count]) => `
            <button class="user-button ${selectedUser === user ? "active" : ""}" data-user="${escapeHtml(user)}">
              <span>${escapeHtml(user)}</span>
              <span class="muted">${count}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderRows(records) {
      el("tableMeta").textContent = `${records.length} of ${allRecords.filter((record) => !record.parse_error).length} records`;
      if (!records.length) {
        el("rows").innerHTML = `<tr><td colspan="7" class="empty">No records match the current filters.</td></tr>`;
        return;
      }

      el("rows").innerHTML = records.map((record) => {
        const random = randomStatus(record);
        const satisfied = satisfiedStatus(record);
        const randomLabel = random === "true" ? "Random" : random === "false" ? "Not random" : "Missing";
        const satisfiedLabel = satisfied === "missing" ? "Missing" : satisfied;
        const comment = record.comment ? escapeHtml(record.comment) : `<span class="muted">No comment</span>`;
        const user = record.user_id ? escapeHtml(record.user_id) : `<span class="muted">n/a</span>`;

        return `
          <tr>
            <td>${record.lineNumber}</td>
            <td>${formatDate(record.timestamp)}</td>
            <td>${user}</td>
            <td><span class="chip ${satisfied}">${satisfiedLabel}</span></td>
            <td><span class="chip ${random === "true" ? "random" : "not-random"}">${randomLabel}</span></td>
            <td>${escapeHtml(confirmedSummary(record))}</td>
            <td class="comment">${comment}${renderDetails(record)}</td>
          </tr>
        `;
      }).join("");
    }

    function renderPartOptions(records) {
      const parts = new Set();
      records.forEach((record) => recordParts(record).forEach((part) => parts.add(part)));
      const ordered = [...PART_ORDER.filter((part) => parts.has(part)), ...[...parts].filter((part) => !PART_ORDER.includes(part)).sort()];
      el("partFilter").innerHTML = `<option value="all">All parts</option>` + ordered.map((part) => (
        `<option value="${escapeHtml(part)}">${escapeHtml(part)}</option>`
      )).join("");
    }

    function renderUserOptions(records) {
      const users = [...new Set(records.map(userId))].sort((a, b) => a.localeCompare(b));
      el("userFilter").innerHTML = `<option value="all">All users</option>` + users.map((user) => (
        `<option value="${escapeHtml(user)}">${escapeHtml(user)}</option>`
      )).join("");
    }

    function render() {
      const records = applyFilters();
      renderCards(records);
      renderSidebar(records);
      renderRows(records);
    }

    function loadText(text, sourceLabel) {
      allRecords = parseJsonl(text);
      const validRecords = allRecords.filter((record) => !record.parse_error && isAfterMinTimestamp(record));
      renderPartOptions(validRecords);
      renderUserOptions(validRecords);
      const parseErrors = allRecords.filter((record) => record.parse_error).length;
      const excluded = allRecords.filter((record) => !record.parse_error && !isAfterMinTimestamp(record)).length;
      el("status").innerHTML = `Loaded <strong>${allRecords.length}</strong> JSONL lines from <strong>${escapeHtml(sourceLabel)}</strong>. Showing records from <strong>${MIN_TIMESTAMP}</strong> onward${excluded ? ` · ${excluded} older records hidden` : ""}${parseErrors ? ` · ${parseErrors} parse errors hidden` : ""}.`;
      render();
    }

    ["search", "randomFilter", "satisfiedFilter", "partFilter", "userFilter"].forEach((id) => {
      el(id).addEventListener("input", render);
      el(id).addEventListener("change", render);
    });

    el("userList").addEventListener("click", (event) => {
      const button = event.target.closest("[data-user]");
      if (!button) return;
      el("userFilter").value = button.dataset.user;
      render();
    });

    el("fileInput").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      loadText(await file.text(), file.name);
    });

    render();
  </script>
</body>
</html>
